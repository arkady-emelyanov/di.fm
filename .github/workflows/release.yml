name: Release

# Builds the app for a published GitHub release and attaches it to it.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload to (e.g. v1.0.0)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Ubuntu, so the binary runs on any distro with glibc >= 2.35.
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: difm-x86_64-linux
          - runner: macos-14
            target: aarch64-apple-darwin
            asset: difm-aarch64-macos.zip
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: difm-x86_64-windows.exe
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Install GTK, WebKitGTK and ALSA
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Check the binary reports the release version
        run: |
          bin=target/${{ matrix.target }}/release/difm
          [ -f "$bin.exe" ] && bin="$bin.exe"
          test "$("$bin" --version)" = "difm ${TAG#v}"
          echo "BIN=$bin" >> "$GITHUB_ENV"
      - name: Package (Linux, Windows)
        if: runner.os != 'macOS'
        run: cp "$BIN" ${{ matrix.asset }}
      # A tray app on macOS is an .app bundle; LSUIElement keeps it out of the Dock.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          app="DI.FM.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "$BIN" "$app/Contents/MacOS/difm"
          iconset=$(mktemp -d)/AppIcon.iconset
          mkdir "$iconset"
          for size in 16 32 128; do
            sips -z $size $size assets/app_icon240.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            sips -z $((size * 2)) $((size * 2)) assets/app_icon240.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/AppIcon.icns"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>DI.FM</string>
            <key>CFBundleDisplayName</key><string>DI.FM</string>
            <key>CFBundleIdentifier</key><string>com.github.arkady-emelyanov.difm</string>
            <key>CFBundleExecutable</key><string>difm</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${TAG#v}</string>
            <key>CFBundleVersion</key><string>${TAG#v}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSUIElement</key><true/>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          # Unsigned builds need at least an ad-hoc signature to launch on Apple silicon.
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" ${{ matrix.asset }}
      - name: Checksum
        run: |
          if command -v sha256sum >/dev/null; then sha256sum ${{ matrix.asset }}; else shasum -a 256 ${{ matrix.asset }}; fi > ${{ matrix.asset }}.sha256
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" ${{ matrix.asset }} ${{ matrix.asset }}.sha256 --clobber
