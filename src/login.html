<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log in to DI.FM</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #11141a; color: #e8ebf0;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  form { width: 320px; display: flex; flex-direction: column; gap: 12px; }
  .logo {
    align-self: center; margin-bottom: 12px; padding: 6px 12px; border-radius: 6px;
    background: #2f8fff; color: #fff; font-weight: 800; font-size: 26px; letter-spacing: 1px;
  }
  h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; text-align: center; }
  input {
    padding: 11px 12px; border-radius: 6px; border: 1px solid #2c323d;
    background: #1a1f27; color: inherit; font: inherit; outline: none;
  }
  input:focus { border-color: #2f8fff; }
  button {
    padding: 11px; border: 0; border-radius: 6px; background: #2f8fff; color: #fff;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .error { min-height: 1.4em; color: #ff6b6b; font-size: 13px; text-align: center; }
  .alt { margin-top: 18px; text-align: center; font-size: 13px; color: #8b93a1; }
  .alt a { color: #6cb0ff; text-decoration: none; cursor: pointer; }
</style>
</head>
<body>
<form id="form" autocomplete="on">
  <div class="logo">__NAME__</div>
  <h1>Log in with your __NAME__ account</h1>
  <input id="email" type="email" placeholder="Email address" autocomplete="username" required autofocus>
  <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
  <button id="submit" type="submit">Log in</button>
  <div class="error" id="error"></div>
  <div class="alt">
    Signed up with Google or Apple?<br>
    <a href="__SITE__login">Sign in via the __NAME__ website</a>
  </div>
</form>
<script>
  var form = document.getElementById('form');
  var submit = document.getElementById('submit');
  var error = document.getElementById('error');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    error.textContent = '';
    submit.disabled = true;
    submit.textContent = 'Logging in…';
    window.ipc.postMessage(JSON.stringify({
      kind: 'password',
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    }));
  });
  window.loginFailed = function (message) {
    error.textContent = message;
    submit.disabled = false;
    submit.textContent = 'Log in';
    document.getElementById('password').select();
  };
</script>
</body>
</html>
